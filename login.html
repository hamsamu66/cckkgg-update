<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat Bantu CKG - Verifikasi akun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-app: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0f172a;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at top right, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 40px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo-area {
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -1px;
            color: var(--text-main);
        }

        .logo-area p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 5px 0 0 0;
        }

        /* BANNER IKLAN AREA */
        .promo-container {
            width: 100%;
            height: 140px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
        }

        .promo-loading {
            position: absolute;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* INPUT AREA & REMEMBER ME */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px 35px 12px 14px;
            /* Padding kanan dilebarkan untuk tombol X */
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .input-group input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-group input[type="text"]::placeholder {
            color: #475569;
        }

        /* Tombol Silang (Clear Username) */
        .btn-clear {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: none;
            /* Disembunyikan awalnya */
            padding: 0;
            transition: color 0.2s;
        }

        .btn-clear:hover {
            color: var(--accent-red);
        }

        /* Checkbox Simpan Username */
        .remember-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .remember-wrapper input[type="checkbox"] {
            cursor: pointer;
            width: 14px;
            height: 14px;
            accent-color: var(--accent-blue);
        }

        .remember-wrapper label {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: var(--accent-blue-hover);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-wa {
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box;
        }

        .btn-wa:hover {
            background: var(--accent-green-hover);
        }

        .btn-wa:active {
            transform: scale(0.98);
        }

        .status-area {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-muted);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cyber-toast {
            min-width: 250px;
            padding: 14px 18px;
            background: var(--bg-panel);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.3s ease forwards;
            border-left: 4px solid var(--accent-red);
        }

        @keyframes toastIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-area">
            <h1>LoginAKUN</h1>
            <p>Enterprise Automation System</p>
        </div>

        <!-- Banner Iklan Slider -->
        <div class="promo-container" id="promo-container">
            <div class="promo-loading" id="promo-loading">
                <div class="spinner"></div> Memuat info...
            </div>
            <img id="promo-image" src="" alt="Promo Banner" style="opacity: 0;">
        </div>

        <div class="input-group">
            <label for="input-username">Akses Sistem</label>

            <!-- Input dengan tombol hapus (X) -->
            <div class="input-wrapper">
                <input type="text" id="input-username" placeholder="Masukkan Username Terdaftar" autocomplete="off"
                    spellcheck="false">
                <button id="btn-clear" class="btn-clear" title="Hapus Username">✖</button>
            </div>

            <!-- Checkbox Simpan -->
            <div class="remember-wrapper">
                <input type="checkbox" id="check-remember">
                <label for="check-remember">Simpan Username</label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-login" id="btn-login">Verifikasi & Masuk</button>

            <a href="https://wa.me/6281949983095?text=Sam,%20mau%20tanya%20soal%20aplikasi%20AlatBantuCKG..."
                target="_blank" class="btn-wa">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                    </path>
                </svg>
                Hubungi Admin Untuk Daftar
            </a>
        </div>

        <div class="status-area" id="status-area">
            <div class="spinner" id="status-spinner"></div>
            <span id="version-status">Memeriksa pembaruan lisensi...</span>
        </div>
    </div>

    <!-- Wadah Notifikasi Error -->
    <div id="toast-container"></div>

    <script>
        const { ipcRenderer } = require('electron');

        // --- SISTEM IKLAN SLIDER ---
        const PROMO_URL = 'https://raw.githubusercontent.com/hamsamu66/cckkgg-update/main/promoo.json';
        const promoImage = document.getElementById('promo-image');
        const promoLoading = document.getElementById('promo-loading');

        async function loadPromo() {
            try {
                const response = await fetch(PROMO_URL);
                const data = await response.json();

                if (data.iklan && data.iklan.length > 0) {
                    promoLoading.style.display = 'none';
                    let currentIndex = 0;

                    const ubahGambar = () => {
                        promoImage.style.opacity = '0';
                        setTimeout(() => {
                            promoImage.src = data.iklan[currentIndex];
                            promoImage.style.opacity = '1';
                            currentIndex = (currentIndex + 1) % data.iklan.length;
                        }, 500);
                    };

                    ubahGambar();
                    setInterval(ubahGambar, data.durasi_detik * 1000);
                }
            } catch (error) {
                console.error("Gagal memuat iklan:", error);
                promoLoading.innerHTML = "Gagal memuat data promosi.";
            }
        }

        loadPromo();

        // --- SISTEM LOGIN & REMEMBER ME ---
        let systemVersions = { licenseVersion: 0, automationVersion: 0 };
        const btnLogin = document.getElementById('btn-login');
        const inputUsername = document.getElementById('input-username');
        const btnClear = document.getElementById('btn-clear');
        const checkRemember = document.getElementById('check-remember');
        const versionStatus = document.getElementById('version-status');
        const statusSpinner = document.getElementById('status-spinner');

        // 1. Cek apakah ada username yang tersimpan saat aplikasi dibuka
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('autoCkgUsername');
            if (savedUser) {
                inputUsername.value = savedUser;
                checkRemember.checked = true;
                btnClear.style.display = 'block'; // Tampilkan tombol X
            }
        });

        // 2. Munculkan/Hilangkan tombol X saat mengetik
        inputUsername.addEventListener('input', () => {
            if (inputUsername.value.trim().length > 0) {
                btnClear.style.display = 'block';
            } else {
                btnClear.style.display = 'none';
            }
        });

        // 3. Fungsi menghapus input dan menghapus memori
        btnClear.addEventListener('click', () => {
            inputUsername.value = '';
            checkRemember.checked = false;
            btnClear.style.display = 'none';
            localStorage.removeItem('autoCkgUsername'); // Hapus dari memori
            inputUsername.focus();
        });

        // 4. Tangkap info versi lisensi dari main.js
        ipcRenderer.on('set-version-info', (event, versions) => {
            systemVersions = versions;
            statusSpinner.style.display = 'none';
            versionStatus.style.color = '#10b981';
            versionStatus.innerHTML = `Sistem Siap (Lisensi v${versions.licenseVersion})`;
        });

        btnLogin.addEventListener('click', prosesLogin);

        inputUsername.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') prosesLogin();
        });

        async function prosesLogin() {
            const user = inputUsername.value.trim();

            if (!user) {
                showNotification("Username tidak boleh kosong!");
                inputUsername.focus();
                return;
            }

            // Simpan atau Hapus memori berdasarkan centang Checkbox
            if (checkRemember.checked) {
                localStorage.setItem('autoCkgUsername', user);
            } else {
                localStorage.removeItem('autoCkgUsername');
            }

            const originalText = btnLogin.innerText;
            btnLogin.innerText = "Memverifikasi...";
            btnLogin.disabled = true;

            try {
                const res = await ipcRenderer.invoke('proses-login', user, systemVersions);

                if (!res.success) {
                    showNotification(res.message);
                    btnLogin.innerText = originalText;
                    btnLogin.disabled = false;
                }
            } catch (error) {
                showNotification("Terjadi kesalahan sistem internal.");
                btnLogin.innerText = originalText;
                btnLogin.disabled = false;
            }
        }

        function showNotification(pesan) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'cyber-toast';
            toast.innerHTML = `<span>❌</span> <span>${pesan}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = "toastOut 0.3s forwards";
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>

</html>
