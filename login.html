<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alat Bantu CKG - Verifikasi akun</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #03060c;
            --panel: rgba(9, 14, 24, .72);
            --panel-solid: #0a101b;
            --line: rgba(255, 255, 255, .09);
            --line-soft: rgba(255, 255, 255, .055);
            --text: #f8fafc;
            --muted: #8b98aa;
            --subtle: #526075;
            --blue: #4f8cff;
            --blue-strong: #3478ff;
            --moon: #e8f2ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 82% 8%, rgba(61, 103, 168, .12), transparent 32%),
                radial-gradient(circle at 12% 90%, rgba(30, 64, 110, .08), transparent 30%),
                var(--bg);
            transition: background 1.4s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(115deg, transparent 0%, rgba(255, 255, 255, .012) 48%, transparent 100%);
            z-index: 0;
        }

        body.night-active {
            background:
                radial-gradient(circle at 86% 8%, rgba(134, 181, 239, .22), transparent 28%),
                radial-gradient(circle at 50% 50%, rgba(20, 39, 68, .16), transparent 62%),
                #02050a;
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: .8;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: .16;
            box-shadow: 0 0 7px rgba(255, 255, 255, .75);
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .12;
                transform: scale(.75);
            }

            50% {
                opacity: .85;
                transform: scale(1.25);
            }
        }

        .scene-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            isolation: isolate;
        }

        .ambient-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 87% 9%, rgba(218, 237, 255, .24) 0%, rgba(128, 171, 220, .09) 26%, transparent 58%);
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: -1;
        }

        .scene-wrapper.night-on .ambient-glow {
            opacity: 1;
        }

        /* ---------- MOON ---------- */

        .moon-assembly {
            position: absolute;
            top: 42px;
            right: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
        }

        .moon {
            position: relative;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            background:
                radial-gradient(circle at 30% 26%, #fff 0%, #f5f9ff 34%, #d7e0eb 72%, #b5c2d1 100%);
            box-shadow:
                inset -14px -12px 25px rgba(0, 0, 0, .28),
                inset 8px 8px 18px rgba(255, 255, 255, .9),
                0 0 28px rgba(210, 235, 255, .08);
            transition:
                transform 1.1s cubic-bezier(.2, .8, .2, 1),
                box-shadow 1.1s ease,
                filter 1.1s ease;
        }

        .moon::before {
            content: "";
            position: absolute;
            inset: -20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, .28), transparent 62%);
            opacity: .7;
        }

        .moon::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset -20px -12px 25px rgba(35, 48, 65, .16);
            pointer-events: none;
        }

        .crater {
            position: absolute;
            border-radius: 50%;
            background: rgba(74, 89, 108, .13);
            box-shadow:
                inset 2px 2px 5px rgba(39, 50, 64, .22),
                inset -2px -2px 4px rgba(255, 255, 255, .32);
        }

        .crater-1 {
            top: 22%;
            left: 28%;
            width: 25px;
            height: 25px;
        }

        .crater-2 {
            top: 58%;
            left: 62%;
            width: 35px;
            height: 35px;
        }

        .crater-3 {
            top: 64%;
            left: 22%;
            width: 16px;
            height: 16px;
        }

        .crater-4 {
            top: 38%;
            left: 72%;
            width: 12px;
            height: 12px;
        }

        .moon-hint {
            position: absolute;
            top: 124px;
            width: 190px;
            text-align: center;
            color: rgba(204, 224, 248, .58);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.8px;
            line-height: 1.7;
            text-transform: uppercase;
            animation: pulseHint 2.2s ease-in-out infinite;
            pointer-events: none;
            transition: opacity .5s ease;
        }

        @keyframes pulseHint {

            0%,
            100% {
                opacity: .35;
            }

            50% {
                opacity: 1;
            }
        }

        .scene-wrapper.night-on .moon {
            transform: scale(1.045);
            filter: saturate(.9);
            box-shadow:
                inset -12px -10px 22px rgba(0, 0, 0, .24),
                inset 8px 8px 18px rgba(255, 255, 255, 1),
                0 0 42px 8px rgba(215, 236, 255, .55),
                0 0 105px 28px rgba(183, 217, 252, .24),
                0 0 190px 55px rgba(170, 210, 250, .10);
        }

        .scene-wrapper.night-on .moon-hint {
            opacity: 0;
        }

        /* ---------- LOGIN CARD ---------- */

        .login-card {
            position: relative;
            width: min(380px, calc(100vw - 36px));
            padding: 32px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background:
                linear-gradient(145deg, rgba(16, 24, 39, .78), rgba(5, 9, 16, .76));
            backdrop-filter: blur(28px) saturate(125%);
            -webkit-backdrop-filter: blur(28px) saturate(125%);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, .48),
                0 8px 30px rgba(0, 0, 0, .28),
                inset 0 1px 0 rgba(255, 255, 255, .055);
            z-index: 20;
            opacity: .05;
            transform: translateY(18px) scale(.975);
            pointer-events: none;
            filter: blur(5px) brightness(.25);
            transition:
                opacity 1s ease,
                transform 1s cubic-bezier(.2, .8, .2, 1),
                filter 1s ease,
                box-shadow 1s ease;
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, .06), transparent 28%),
                radial-gradient(circle at 90% 0%, rgba(168, 207, 250, .09), transparent 32%);
        }

        .login-card::after {
            content: "";
            position: absolute;
            top: 18px;
            right: 18px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(173, 213, 255, .8);
            box-shadow: 0 0 14px rgba(173, 213, 255, .8);
            opacity: 0;
            transition: opacity .6s ease;
        }

        .scene-wrapper.night-on .login-card {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            filter: blur(0) brightness(1);
            border-color: rgba(195, 220, 246, .16);
            box-shadow:
                -35px 38px 85px rgba(0, 0, 0, .72),
                0 20px 60px rgba(0, 0, 0, .30),
                inset 0 1px 0 rgba(255, 255, 255, .08),
                inset -1px 0 0 rgba(185, 219, 249, .08);
        }

        .scene-wrapper.night-on .login-card::after {
            opacity: 1;
        }

        .logo-area {
            position: relative;
            margin-bottom: 26px;
            text-align: left;
            z-index: 1;
        }

        .logo-area h1 {
            margin: 0;
            color: #fff;
            font-size: 25px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -1.1px;
        }

        .logo-area h1::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-left: 7px;
            margin-bottom: 3px;
            border-radius: 50%;
            background: var(--blue);
            box-shadow: 0 0 12px rgba(79, 140, 255, .75);
        }

        .logo-area p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        /* ---------- PROMO ---------- */

        .promo-container {
            position: relative;
            width: 100%;
            height: 126px;
            margin-bottom: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line-soft);
            border-radius: 13px;
            background: #050910;
            box-shadow:
                inset 0 0 25px rgba(0, 0, 0, .55),
                0 8px 25px rgba(0, 0, 0, .12);
        }

        .promo-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255, 255, 255, .025), transparent 42%, rgba(255, 255, 255, .018));
        }

        .promo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity .55s ease, transform 4s ease;
        }

        .promo-container:hover img {
            transform: scale(1.025);
        }

        /* ---------- INPUT ---------- */

        .input-group {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a6b2c2;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .8px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input[type="text"] {
            width: 100%;
            height: 48px;
            padding: 0 42px 0 14px;
            border: 1px solid rgba(157, 181, 210, .13);
            border-radius: 11px;
            outline: none;
            background: rgba(2, 7, 14, .62);
            color: #fff;
            font: 500 13px 'Inter', sans-serif;
            box-shadow:
                inset 0 1px 3px rgba(0, 0, 0, .42),
                0 1px 0 rgba(255, 255, 255, .018);
            transition: border-color .25s ease, background .25s ease, box-shadow .25s ease;
        }

        .input-group input[type="text"]:hover {
            border-color: rgba(157, 181, 210, .23);
        }

        .input-group input[type="text"]:focus {
            border-color: rgba(79, 140, 255, .78);
            background: rgba(3, 10, 20, .9);
            box-shadow:
                0 0 0 3px rgba(79, 140, 255, .10),
                inset 0 1px 3px rgba(0, 0, 0, .42),
                0 8px 25px rgba(0, 0, 0, .14);
        }

        .input-group input[type="text"]::placeholder {
            color: #536176;
        }

        .btn-clear {
            position: absolute;
            right: 10px;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #526075;
            font-size: 12px;
            cursor: pointer;
            transition: .2s ease;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }

        .remember-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 11px;
        }

        .remember-wrapper input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin: 0;
            accent-color: var(--blue);
            cursor: pointer;
        }

        .remember-wrapper label {
            margin: 0;
            color: #77859a;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            cursor: pointer;
        }

        /* ---------- BUTTONS ---------- */

        .btn-group {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .btn-login,
        .btn-wa {
            width: 100%;
            height: 47px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 11px;
            font: 600 12px 'Inter', sans-serif;
            cursor: pointer;
            transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .btn-login {
            border: 1px solid rgba(139, 188, 255, .18);
            background: linear-gradient(180deg, #4e8cff, #3478ef);
            color: #fff;
            box-shadow:
                0 8px 24px rgba(39, 102, 220, .25),
                inset 0 1px 0 rgba(255, 255, 255, .22);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            background: linear-gradient(180deg, #5b96ff, #3a7ff5);
            box-shadow:
                0 11px 28px rgba(39, 102, 220, .32),
                inset 0 1px 0 rgba(255, 255, 255, .25);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .btn-login:disabled {
            opacity: .72;
            cursor: wait;
            transform: none;
        }

        .btn-wa {
            border: 1px solid rgba(170, 194, 221, .10);
            background: rgba(255, 255, 255, .025);
            color: #aeb9c8;
            text-decoration: none;
        }

        .btn-wa:hover {
            border-color: rgba(170, 194, 221, .22);
            background: rgba(255, 255, 255, .055);
            color: #fff;
        }

        /* ---------- STATUS ---------- */

        .status-area {
            position: relative;
            z-index: 1;
            min-height: 16px;
            margin-top: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: #718097;
            font-size: 10px;
        }

        .status-area #version-status {
            transition: color .25s ease;
        }

        .quota-info {
            position: relative;
            z-index: 1;
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, .055);
            color: #4f5d70;
            text-align: center;
            font-size: 9px;
            letter-spacing: .15px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            flex: 0 0 auto;
            border: 2px solid rgba(190, 213, 239, .15);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- TOAST ---------- */

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .cyber-toast {
            min-width: 260px;
            max-width: min(360px, calc(100vw - 40px));
            padding: 13px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(239, 68, 68, .18);
            border-left: 3px solid #ef4444;
            border-radius: 11px;
            background: rgba(9, 13, 21, .92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            color: #f8fafc;
            font-size: 11px;
            font-weight: 500;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .5);
            animation: toastIn .32s cubic-bezier(.2, .8, .2, 1) forwards;
        }

        @keyframes toastIn {
            from {
                transform: translateX(110%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 650px) {
            .moon-assembly {
                top: 25px;
                right: 25px;
            }

            .moon {
                width: 82px;
                height: 82px;
            }

            .moon-hint {
                display: none;
            }

            .login-card {
                width: min(380px, calc(100vw - 28px));
                padding: 26px 22px;
                border-radius: 19px;
            }

            .promo-container {
                height: 108px;
            }
        }

        @media (max-height: 650px) and (min-width: 651px) {
            .moon-assembly {
                top: 20px;
                right: 25px;
                transform: scale(.78);
                transform-origin: top right;
            }

            .login-card {
                transform: translateY(12px) scale(.9);
            }

            .scene-wrapper.night-on .login-card {
                transform: translateY(0) scale(.9);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="starfield"></div>

    <div class="scene-wrapper" id="scene-wrapper">

        <div class="ambient-glow"></div>

        <div class="moon-assembly">
            <div class="moon" id="moon-toggle" title="Klik untuk menerangi malam">
                <div class="crater crater-1"></div>
                <div class="crater crater-2"></div>
                <div class="crater crater-3"></div>
                <div class="crater crater-4"></div>
            </div>
            <div class="moon-hint">Sentuh Aku<br>Bro</div>
        </div>

        <div class="login-card">
            <div class="logo-area">
                <h1>Alat Bantu CKG</h1>
                <p>Secure Automation System</p>
            </div>

            <div class="promo-container" id="promo-container">
                <div class="promo-loading" id="promo-loading"
                    style="color:#64748b; font-size: 11px; display:flex; gap:8px; align-items:center;">
                    <div class="spinner" style="border-top-color:#94a3b8;"></div> Sinkronisasi...
                </div>
                <img id="promo-image" src="" alt="Promo Banner" style="opacity: 0;">
            </div>

            <div class="input-group">
                <label for="input-username">Identitas Pengguna</label>
                <div class="input-wrapper">
                    <input type="text" id="input-username" placeholder="Masukkan username Anda" autocomplete="off"
                        spellcheck="false">
                    <button id="btn-clear" class="btn-clear" title="Hapus">✖</button>
                </div>
                <div class="remember-wrapper">
                    <input type="checkbox" id="check-remember">
                    <label for="check-remember">Simpan sesi login perangkat</label>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-login" id="btn-login">Login Dashboard</button>
                <a href="https://wa.me/6281949983095?text=Sam,%20mau%20tanya%20soal%20aplikasi%20AlatBantuCKG..."
                    target="_blank" class="btn-wa">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                        </path>
                    </svg>
                    Hubungi Admin Untuk Daftar
                </a>
            </div>

            <div class="status-area" id="status-area">
                <div class="spinner" id="status-spinner"></div>
                <span id="version-status">Memeriksa akses...</span>
            </div>

            <div class="quota-info">
                Kuota diperbarui otomatis setiap hari · 07:00 WIB
            </div>
        </div>

    </div>

    <div id="toast-container"></div>

    <script>
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';

            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';

            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';

            starfield.appendChild(star);
        }

        let ipcRenderer;
        try {
            ({ ipcRenderer } = require('electron'));
        } catch (e) {
            ipcRenderer = {
                invoke: async () => ({ success: false, message: "Akses Ditolak: Gunakan aplikasi Desktop Resmi." }),
                on: () => { }
            };
        }

        const PROMO_URL = 'https://raw.githubusercontent.com/hamsamu66/cckkgg-update/main/promoo.json';
        const promoImage = document.getElementById('promo-image');
        const promoLoading = document.getElementById('promo-loading');

        async function loadPromo() {
            try {
                const response = await fetch(PROMO_URL);
                const data = await response.json();

                if (data.iklan && data.iklan.length > 0) {
                    promoLoading.style.display = 'none';
                    let currentIndex = 0;

                    const ubahGambar = () => {
                        promoImage.style.opacity = '0';
                        setTimeout(() => {
                            promoImage.src = data.iklan[currentIndex];
                            promoImage.style.opacity = '1';
                            currentIndex = (currentIndex + 1) % data.iklan.length;
                        }, 500);
                    };
                    ubahGambar();
                    setInterval(ubahGambar, data.durasi_detik * 1000);
                }
            } catch (error) {
                promoLoading.innerHTML = "Gagal memuat visual.";
            }
        }
        loadPromo();

        const sceneWrapper = document.getElementById('scene-wrapper');
        const moonToggle = document.getElementById('moon-toggle');
        const inputUser = document.getElementById('input-username');
        let isNightOn = false;

        moonToggle.addEventListener('click', () => {
            isNightOn = !isNightOn;
            if (isNightOn) {
                sceneWrapper.classList.add('night-on');
                document.body.classList.add('night-active');
                setTimeout(() => inputUser.focus(), 1200);
            } else {
                sceneWrapper.classList.remove('night-on');
                document.body.classList.remove('night-active');
                inputUser.blur();
            }
        });

        let systemVersions = { licenseVersion: 0, automationVersion: 0 };
        const btnLogin = document.getElementById('btn-login');
        const btnClear = document.getElementById('btn-clear');
        const checkRemember = document.getElementById('check-remember');
        const versionStatus = document.getElementById('version-status');
        const statusSpinner = document.getElementById('status-spinner');

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('autoCkgUsername');
            if (savedUser) {
                inputUser.value = savedUser;
                checkRemember.checked = true;
                btnClear.style.display = 'block';
            }
        });

        inputUser.addEventListener('input', () => {
            btnClear.style.display = inputUser.value.trim().length > 0 ? 'block' : 'none';
        });

        btnClear.addEventListener('click', () => {
            inputUser.value = '';
            checkRemember.checked = false;
            btnClear.style.display = 'none';
            localStorage.removeItem('autoCkgUsername');
            inputUser.focus();
        });

        ipcRenderer.on('set-version-info', (event, versions) => {
            systemVersions = versions;
            statusSpinner.style.display = 'none';
            versionStatus.style.color = '#3b82f6';
            versionStatus.innerHTML = `Sistem Siap · Lisensi v${versions.licenseVersion}`;
        });

        btnLogin.addEventListener('click', prosesLogin);
        inputUser.addEventListener('keypress', (e) => { if (e.key === 'Enter') prosesLogin(); });

        async function prosesLogin() {
            const user = inputUser.value.trim();

            if (!user) {
                showNotification("Masukkan username.");
                inputUser.focus();
                return;
            }

            if (checkRemember.checked) {
                localStorage.setItem('autoCkgUsername', user);
            } else {
                localStorage.removeItem('autoCkgUsername');
            }

            const originalText = btnLogin.innerHTML;
            btnLogin.innerHTML = "<div class='spinner' style='border-top-color:#fff;'></div> Memproses...";
            btnLogin.disabled = true;

            try {
                const res = await ipcRenderer.invoke('proses-login', user, systemVersions);

                if (!res.success) {
                    showNotification(res.message);
                    btnLogin.innerHTML = originalText;
                    btnLogin.disabled = false;
                }
            } catch (error) {
                showNotification("Terjadi hambatan komunikasi dengan server.");
                btnLogin.innerHTML = originalText;
                btnLogin.disabled = false;
            }
        }

        function showNotification(pesan) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'cyber-toast';
            toast.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> <span>${pesan}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>

</html>
